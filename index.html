<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌟 Juego de Palabras – 2.º Grado</title>
  <style>
    /* ═══════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #161928;
      --card:      #1e2235;
      --border:    #2e3460;
      --purple:    #7c5cbf;
      --purple-lt: #a07ee0;
      --cyan:      #00d4ff;
      --cyan-dk:   #0099cc;
      --yellow:    #ffd94d;
      --yellow-dk: #e6b800;
      --green:     #00e676;
      --green-dk:  #00a152;
      --red:       #ff5252;
      --red-dk:    #c62828;
      --text:      #f0f2ff;
      --text-dim:  #8892b0;
      --radius:    18px;
      --shadow:    0 8px 32px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════ */
    #header {
      background: linear-gradient(135deg, #1a0533 0%, #0d1a40 100%);
      border-bottom: 3px solid var(--purple);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(124,92,191,0.4);
    }

    #header h1 {
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      font-weight: 900;
      background: linear-gradient(90deg, var(--cyan), var(--purple-lt), var(--yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    #fullscreen-btn {
      background: var(--purple);
      border: none;
      color: #fff;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-weight: 700;
    }
    #fullscreen-btn:hover { background: var(--purple-lt); transform: scale(1.06); }

    /* ── Score display ── */
    #score-display {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(255,217,77,0.15), rgba(255,217,77,0.05));
      border: 2px solid var(--yellow-dk);
      border-radius: 50px;
      padding: 8px 22px;
      position: relative;
    }
    #score-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--yellow-dk);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #score-value {
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 0 0 12px rgba(255,217,77,0.4);
      min-width: 70px;
      text-align: right;
      transition: transform 0.2s;
    }
    #score-value.bump {
      animation: scoreBump 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes scoreBump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Floating +pts label */
    .pts-float {
      position: fixed;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 0 0 16px rgba(255,217,77,0.7), 0 2px 6px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 9998;
      animation: ptsFloat 1.6s ease-out forwards;
    }
    @keyframes ptsFloat {
      0%   { transform: translateY(0)   scale(1);   opacity: 1; }
      100% { transform: translateY(-110px) scale(1.3); opacity: 0; }
    }

    /* Pts badge in saved list */
    #saved-list li .pts-tag {
      display: inline-block;
      background: var(--yellow-dk);
      color: #1a0d00;
      font-size: 0.75rem;
      font-weight: 900;
      border-radius: 20px;
      padding: 2px 9px;
      margin-left: 6px;
      letter-spacing: 0.5px;
      vertical-align: middle;
    }

    /* ═══════════════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════════════ */
    #app {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      min-height: calc(100vh - 80px);
      max-width: 860px;
      margin: 0 auto;
    }

    .module {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .module::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    #mod1::before { background: linear-gradient(90deg, var(--cyan), var(--purple-lt)); }

    .module-title {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.5px;
    }
    #mod1 .module-title { color: var(--cyan); }

    /* ═══════════════════════════════════════════════════
       MODULE 1 – RULETA
    ═══════════════════════════════════════════════════ */

    /* ── Spinner visual ── */
    #spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #wheel-container {
      position: relative;
      width: min(260px, 90vw);
      height: min(260px, 90vw);
    }

    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid var(--purple-lt);
      box-shadow: 0 0 30px rgba(124,92,191,0.6), 0 0 60px rgba(124,92,191,0.2);
      transition: transform 0s;
      position: relative;
    }

    #wheel-pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 36px solid var(--yellow);
      filter: drop-shadow(0 4px 8px rgba(255,217,77,0.7));
      z-index: 10;
    }

    #spin-btn {
      background: linear-gradient(135deg, var(--purple), #4a2d8a);
      border: 3px solid var(--purple-lt);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 900;
      padding: 14px 38px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 6px 24px rgba(124,92,191,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #spin-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 8px 32px rgba(124,92,191,0.7); }
    #spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #selected-word {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 900;
      text-align: center;
      min-height: 70px;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255,217,77,0.5), 0 4px 8px rgba(0,0,0,0.5);
      letter-spacing: 4px;
      transition: all 0.3s;
      word-break: break-all;
    }
    #selected-word.pop {
      animation: popWord 0.5s ease;
    }
    @keyframes popWord {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── Textarea & buttons ── */
    #writing-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #sentence-input {
      width: 100%;
      min-height: 90px;
      background: var(--surface);
      border: 2.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-weight: 600;
      font-family: inherit;
      padding: 12px 14px;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.5;
    }
    #sentence-input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.2);
    }
    #sentence-input::placeholder { color: var(--text-dim); }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 110px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(0.85rem, 2vw, 1rem);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s, filter 0.12s;
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: scale(1.05); filter: brightness(1.12); }
    .btn:active { transform: scale(0.97); }

    .btn-clear  { background: linear-gradient(135deg, #ff6b6b, #cc2200); color: #fff; }
    .btn-save   { background: linear-gradient(135deg, var(--green), var(--green-dk)); color: #002612; }
    .btn-listen { background: linear-gradient(135deg, var(--cyan), var(--cyan-dk)); color: #001a22; }

    /* ── Saved sentences ── */
    #saved-list-wrap {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    #saved-list-wrap h3 {
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #saved-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    #saved-list li {
      background: var(--card);
      border-left: 4px solid var(--cyan);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }
    #saved-list li .word-tag {
      color: var(--yellow);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 6px;
      letter-spacing: 1px;
    }
    #empty-msg { color: var(--text-dim); font-size: 0.95rem; text-align: center; padding: 10px; }

    /* ═══════════════════════════════════════════════════
       MODAL DE ADVERTENCIA
    ═══════════════════════════════════════════════════ */
    #warn-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }
    #warn-overlay.show { display: flex; }

    #warn-box {
      background: linear-gradient(135deg, #3a0a0a, #1a0000);
      border: 4px solid var(--red);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(255,82,82,0.6), 0 20px 60px rgba(0,0,0,0.8);
      animation: warnPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes warnPop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #warn-icon  {
      font-size: clamp(3.5rem, 10vw, 5rem);
      line-height: 1;
      margin-bottom: 16px;
    }
    #warn-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 900;
      color: var(--red);
      margin-bottom: 14px;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    #warn-word-highlight {
      display: inline-block;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      color: var(--yellow);
      background: rgba(255,217,77,0.15);
      border: 3px solid var(--yellow);
      border-radius: 14px;
      padding: 6px 24px;
      margin: 10px 0 20px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(255,217,77,0.5);
    }
    #warn-subtitle {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: #ffb3b3;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    #warn-close-btn {
      background: linear-gradient(135deg, var(--red), var(--red-dk));
      border: none;
      border-radius: 50px;
      color: #fff;
      font-family: inherit;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 900;
      padding: 16px 48px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,82,82,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }
    #warn-close-btn:hover { transform: scale(1.06); box-shadow: 0 8px 32px rgba(255,82,82,0.7); }

    /* ── Confetti canvas ── */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* ═══════════════════════════════════════════════════
       WHEEL SEGMENTS  (drawn via canvas)
    ═══════════════════════════════════════════════════ */
    #wheel canvas { border-radius: 50%; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--purple); }

    /* ── Floating emoji animation ── */
    .float-emoji {
      position: fixed;
      font-size: 2.5rem;
      pointer-events: none;
      z-index: 9998;
      animation: floatUp 1.4s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--green);
      color: #001a0a;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 8px 30px rgba(0,230,118,0.4);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 9997;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Pulse for selected word */
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(255,217,77,0.5); }
      50%       { text-shadow: 0 0 40px rgba(255,217,77,0.9), 0 0 60px rgba(255,217,77,0.4); }
    }
    #selected-word.glow { animation: glowPulse 1.5s ease-in-out infinite; }

    /* Shake on wrong */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-10px); }
      40%     { transform: translateX(10px); }
      60%     { transform: translateX(-8px); }
      80%     { transform: translateX(8px); }
    }
    .shake { animation: shake 0.5s ease; }
  </style>
</head>
<body>

<!-- ═══════ HEADER ═══════ -->
<header id="header">
  <h1>🌟 Juego de Palabras – 2.º Grado</h1>
  <div id="score-display">
    <span id="score-label">⭐ Puntos</span>
    <span id="score-value">0</span>
  </div>
  <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
</header>

<!-- ═══════ MAIN ═══════ -->
<main id="app">

  <!-- ───── MÓDULO 1: RULETA ───── -->
  <section class="module" id="mod1">
    <p class="module-title">🎡 RULETA DE PALABRAS</p>

    <!-- Wheel -->
    <div id="spinner-wrap">
      <div id="wheel-container">
        <div id="wheel-pointer"></div>
        <canvas id="wheel-canvas"></canvas>
      </div>
      <button id="spin-btn" onclick="spinWheel()">¡GIRAR! 🎰</button>
    </div>

    <!-- Selected word display -->
    <div id="selected-word">⬆ ¡GIRÁ LA RULETA!</div>

    <!-- Writing area -->
    <div id="writing-area">
      <label for="sentence-input" style="font-size:0.95rem; color:var(--text-dim); font-weight:700;">
        ✏️ Escribí una oración con la palabra:
      </label>
      <textarea
        id="sentence-input"
        placeholder="Escribí tu oración acá..."
        rows="3"
        spellcheck="false"
      ></textarea>
      <div class="btn-row">
        <button class="btn btn-clear"  onclick="clearInput()">🗑️ Limpiar</button>
        <button class="btn btn-save"   onclick="saveSentence()">💾 Guardar</button>
        <button class="btn btn-listen" onclick="speakSentence()" id="listen-btn">🔊 Escuchar</button>
      </div>
    </div>

    <!-- Saved list -->
    <div id="saved-list-wrap">
      <h3>📋 Mis oraciones guardadas</h3>
      <ul id="saved-list">
        <li id="empty-msg">Todavía no guardaste ninguna oración 📝</li>
      </ul>
    </div>
  </section>

</main>

<!-- ═══════ MODAL ADVERTENCIA ═══════ -->
<div id="warn-overlay" onclick="closeWarnModal()">
  <div id="warn-box" onclick="event.stopPropagation()">
    <div id="warn-icon">⚠️</div>
    <div id="warn-title">¡Falta usar la palabra!</div>
    <div id="warn-word-highlight" id="warn-word"></div>
    <div id="warn-subtitle">
      Escribí una oración que tenga<br>esta palabra adentro.
    </div>
    <button id="warn-close-btn" onclick="closeWarnModal()">✅ ¡Entendí, vuelvo a escribir!</button>
  </div>
</div>

<!-- ═══════ CONFETTI CANVAS ═══════ -->
<canvas id="confetti-canvas"></canvas>

<!-- ═══════ TOAST ═══════ -->
<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════
   FULLSCREEN
════════════════════════════════════════════════════ */
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    document.getElementById('fullscreen-btn').textContent = '✕ Salir de pantalla completa';
  } else {
    document.exitFullscreen();
    document.getElementById('fullscreen-btn').textContent = '⛶ Pantalla Completa';
  }
}

/* ════════════════════════════════════════════════════
   MODULE 1 – WHEEL
════════════════════════════════════════════════════ */
const WORDS = ['GATO','PELOTA','ROBOT','PIZZA','AUTO','SOL','ESCUELA','AMIGO','PARQUE','CASA'];
const SEGMENT_COLORS = [
  '#7c5cbf','#00b8d9','#e65100','#2e7d32','#ad1457',
  '#1565c0','#f57f17','#4527a0','#00838f','#558b2f'
];

let currentAngle = 0;
let isSpinning = false;
let selectedWord = '';

const wheelCanvas = document.getElementById('wheel-canvas');
const wCtx = wheelCanvas.getContext('2d');

function initWheel() {
  const size = wheelCanvas.parentElement.offsetWidth;
  wheelCanvas.width  = size;
  wheelCanvas.height = size;
  drawWheel(0);
}

function drawWheel(rotation) {
  const c  = wCtx;
  const W  = wheelCanvas.width;
  const cx = W / 2, cy = W / 2, r = W / 2 - 4;
  const seg = (2 * Math.PI) / WORDS.length;

  c.clearRect(0, 0, W, W);

  WORDS.forEach((word, i) => {
    const startAngle = rotation + i * seg;
    const endAngle   = startAngle + seg;
    const midAngle   = startAngle + seg / 2;

    // Segment fill
    c.beginPath();
    c.moveTo(cx, cy);
    c.arc(cx, cy, r, startAngle, endAngle);
    c.closePath();
    c.fillStyle = SEGMENT_COLORS[i];
    c.fill();

    // Segment border
    c.strokeStyle = 'rgba(255,255,255,0.25)';
    c.lineWidth = 2;
    c.stroke();

    // Label
    c.save();
    c.translate(cx, cy);
    c.rotate(midAngle);
    c.textAlign = 'right';
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(11, W * 0.054)}px "Segoe UI", Arial`;
    c.shadowColor = 'rgba(0,0,0,0.7)';
    c.shadowBlur = 4;
    c.fillText(word, r - 10, 5);
    c.restore();
  });

  // Center circle
  c.beginPath();
  c.arc(cx, cy, W * 0.1, 0, 2 * Math.PI);
  c.fillStyle = '#0d0f1a';
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.4)';
  c.lineWidth = 3;
  c.stroke();

  // Center dot
  c.beginPath();
  c.arc(cx, cy, W * 0.04, 0, 2 * Math.PI);
  c.fillStyle = '#ffd94d';
  c.fill();
}

function spinWheel() {
  if (isSpinning) return;
  // Block if a word is already selected
  if (selectedWord) {
    showToast('✏️ ¡Primero guardá tu oración!', 'warn');
    document.getElementById('sentence-input').focus();
    // Shake the spin button as visual feedback
    const sb = document.getElementById('spin-btn');
    sb.classList.add('shake');
    setTimeout(() => sb.classList.remove('shake'), 500);
    return;
  }
  isSpinning = true;

  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;

  const totalTurns  = 5 + Math.random() * 5;          // 5–10 full rotations
  const extraAngle  = Math.random() * 2 * Math.PI;     // random final offset
  const targetAngle = currentAngle + totalTurns * 2 * Math.PI + extraAngle;
  const duration    = 3500 + Math.random() * 1200;
  const startTime   = performance.now();
  const startAngle  = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const angle    = startAngle + (targetAngle - startAngle) * easeOut(progress);

    currentAngle = angle;
    drawWheel(angle);

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = angle;
      isSpinning = false;
      // Keep button disabled until word is used
      determineWord();
    }
  }

  // Clear glow & display
  const swEl = document.getElementById('selected-word');
  swEl.classList.remove('glow', 'pop');
  swEl.textContent = '⏳ Girando...';
  swEl.style.color = 'var(--text-dim)';

  requestAnimationFrame(frame);
}

function determineWord() {
  // Pointer is at top (−π/2). We need to find which segment aligns.
  const seg = (2 * Math.PI) / WORDS.length;
  // Normalize the current angle so that 0 = top
  const normalized = (((-currentAngle - Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const idx = Math.floor(normalized / seg) % WORDS.length;
  selectedWord = WORDS[idx];

  const swEl = document.getElementById('selected-word');
  swEl.textContent = selectedWord;
  swEl.style.color = 'var(--yellow)';
  swEl.classList.remove('pop', 'glow');
  void swEl.offsetWidth; // reflow
  swEl.classList.add('pop');
  setTimeout(() => swEl.classList.add('glow'), 500);

  // Disable spin button until the word is used
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  spinBtn.title = 'Primero guardá tu oración';

  // Focus textarea
  document.getElementById('sentence-input').focus();
}

/* ════════════════════════════════════════════════════
   MODULE 1 – WRITING
════════════════════════════════════════════════════ */
let savedSentences = [];
let totalScore = 0;

function addScore(points, fromEl) {
  totalScore += points;

  // Update display with bump animation
  const sv = document.getElementById('score-value');
  sv.textContent = totalScore.toLocaleString('es-AR');
  sv.classList.remove('bump');
  void sv.offsetWidth;
  sv.classList.add('bump');

  // Floating +pts label
  const rect = fromEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'pts-float';
  el.textContent = '+' + points.toLocaleString('es-AR') + ' pts';
  el.style.left = (rect.left + rect.width / 2 - 50) + 'px';
  el.style.top  = (rect.top + window.scrollY - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

// Normaliza texto: minúsculas + sin tildes
function normalize(str) {
  return str
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function wordInSentence(word, sentence) {
  return normalize(sentence).includes(normalize(word));
}

function resetSpinButton() {
  selectedWord = '';
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = false;
  spinBtn.title = '';
  const swEl = document.getElementById('selected-word');
  swEl.classList.remove('glow', 'pop');
  swEl.textContent = '⬆ ¡GIRÁ LA RULETA!';
  swEl.style.color = 'var(--text-dim)';
}

function clearInput() {
  document.getElementById('sentence-input').value = '';
  document.getElementById('sentence-input').focus();
  resetSpinButton();
}

function saveSentence() {
  const textarea = document.getElementById('sentence-input');
  const text = textarea.value.trim();

  if (!text) {
    showToast('✏️ ¡Escribí una oración primero!', 'warn');
    textarea.focus();
    return;
  }

  // Verificar que la palabra esté en la oración
  if (selectedWord && !wordInSentence(selectedWord, text)) {
    showWarnModal(selectedWord);
    textarea.classList.add('shake');
    setTimeout(() => textarea.classList.remove('shake'), 500);
    return;
  }

  // Calcular puntos: +1000 si tiene más de 5 palabras, +500 si tiene la palabra
  const wordCount = text.trim().split(/\s+/).filter(w => w.length > 0).length;
  const pts = wordCount > 5 ? 1000 : 500;

  savedSentences.push({ word: selectedWord || '—', text, pts });
  renderSavedList();
  textarea.value = '';
  addScore(pts, textarea);
  floatEmoji(pts === 1000 ? '🏆' : '🌟', textarea);
  showToast(pts === 1000 ? `🏆 ¡+1000 puntos! ¡Qué oración más larga!` : '🌟 ¡+500 puntos! ¡Oración guardada!');
  resetSpinButton();
}

function renderSavedList() {
  const ul = document.getElementById('saved-list');
  ul.innerHTML = '';
  if (savedSentences.length === 0) {
    ul.innerHTML = '<li id="empty-msg">Todavía no guardaste ninguna oración 📝</li>';
    return;
  }
  savedSentences.forEach(s => {
    const li = document.createElement('li');
    const ptsLabel = s.pts === 1000 ? '🏆 1.000 pts' : '⭐ 500 pts';
    li.innerHTML = `<span class="word-tag">[${s.word}]</span>${s.text}<span class="pts-tag">${ptsLabel}</span>`;
    ul.prepend(li);
  });
}

function speakSentence() {
  if (!('speechSynthesis' in window)) {
    showToast('❌ Tu navegador no soporta voz', 'warn');
    return;
  }
  const text = document.getElementById('sentence-input').value.trim();
  if (!text) { showToast('✏️ ¡Escribí algo primero!', 'warn'); return; }

  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'es-AR';
  utt.rate  = 0.8;
  utt.pitch = 1.1;

  // Try to pick a Spanish voice
  const voices = window.speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang.startsWith('es'));
  if (esVoice) utt.voice = esVoice;

  window.speechSynthesis.speak(utt);

  const btn = document.getElementById('listen-btn');
  btn.textContent = '🔊 Hablando...';
  utt.onend = () => { btn.textContent = '🔊 Escuchar'; };
}

/* ════════════════════════════════════════════════════
   MODAL ADVERTENCIA
════════════════════════════════════════════════════ */
function showWarnModal(word) {
  document.getElementById('warn-word-highlight').textContent = word;
  document.getElementById('warn-overlay').classList.add('show');
}

function closeWarnModal() {
  document.getElementById('warn-overlay').classList.remove('show');
  document.getElementById('sentence-input').focus();
}

/* ════════════════════════════════════════════════════
   CONFETTI
════════════════════════════════════════════════════ */
const confCanvas = document.getElementById('confetti-canvas');
const confCtx    = confCanvas.getContext('2d');
let confettiParticles = [];
let confettiAF = null;

function resizeConfCanvas() {
  confCanvas.width  = window.innerWidth;
  confCanvas.height = window.innerHeight;
}

function launchConfetti() {
  resizeConfCanvas();
  const colors = ['#ffd94d','#00e676','#00d4ff','#a07ee0','#ff6b6b','#ffb74d'];
  for (let i = 0; i < 80; i++) {
    confettiParticles.push({
      x: Math.random() * confCanvas.width,
      y: -10,
      r: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 6,
      vy: 3 + Math.random() * 5,
      alpha: 1,
      spin: Math.random() * 0.3,
      angle: Math.random() * Math.PI * 2,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  if (!confettiAF) animateConfetti();
}

function animateConfetti() {
  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  confettiParticles = confettiParticles.filter(p => p.alpha > 0.02);

  confettiParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.angle += p.spin;
    if (p.y > confCanvas.height * 0.6) p.alpha -= 0.025;

    confCtx.save();
    confCtx.globalAlpha = p.alpha;
    confCtx.fillStyle   = p.color;
    confCtx.translate(p.x, p.y);
    confCtx.rotate(p.angle);
    if (p.shape === 'rect') {
      confCtx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    } else {
      confCtx.beginPath();
      confCtx.arc(0, 0, p.r, 0, Math.PI * 2);
      confCtx.fill();
    }
    confCtx.restore();
  });

  if (confettiParticles.length > 0) {
    confettiAF = requestAnimationFrame(animateConfetti);
  } else {
    confettiAF = null;
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }
}

/* ════════════════════════════════════════════════════
   FLOATING EMOJI
════════════════════════════════════════════════════ */
function floatEmoji(emoji, fromEl) {
  const rect = fromEl.getBoundingClientRect
    ? fromEl.getBoundingClientRect()
    : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };

  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emoji;
  el.style.left = (rect.left + rect.width / 2 - 20) + 'px';
  el.style.top  = (rect.top + window.scrollY) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

/* ════════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════════ */
let toastTimeout;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'warn' ? 'var(--yellow)' : 'var(--green)';
  t.style.color = '#001a0a';
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  initWheel();

  // Load voices async
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
});

window.addEventListener('resize', () => {
  initWheel();
  resizeConfCanvas();
});
</script>
